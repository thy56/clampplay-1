475467"><tspan x="1082" dy="21">键位被按下</tspan><tspan x="1082" dy="21">钢琴本体发出对应音阶</tspan><tspan x="1082" dy="21">动作完成后释放</tspan></text></g><g><rect x="60" y="410" width="230" height="115" rx="14" fill="#FCE4D6" stroke="#E8732A" stroke-width="2"/><text x="80" y="432" font-family="Arial" font-size="11" font-weight="700" fill="#E8732A">GUITAR INPUT</text><text x="82" y="461" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#17191E">吉他和弦指令</text><text x="82" y="487" font-family="Microsoft YaHei,Arial" font-size="14" fill="#475467"><tspan x="82" dy="21">例如 Am / G / F</tspan><tspan x="82" dy="21">节拍、速度、扫弦方向</tspan></text></g><g><rect x="365" y="395" width="245" height="150" rx="14" fill="#DDEBFA" stroke="#4B93E6" stroke-width="2"/><text x="385" y="417" font-family="Arial" font-size="11" font-weight="700" fill="#4B93E6">SCHEDULE</text><text x="387" y="446" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#17191E">和弦展开与时序</text><text x="387" y="472" font-family="Microsoft YaHei,Arial" font-size="14" fill="#475467"><tspan x="387" dy="21">和弦 → 弦 / 品位置</tspan><tspan x="387" dy="21">先按弦确认</tspan><tspan x="387" dy="21">等待稳定窗口</tspan><tspan x="387" dy="21">触发拨弦 / 扫弦</tspan></text></g><g><rect x="700" y="350" width="270" height="195" rx="14" fill="#E8EAED" stroke="#3C4048" stroke-width="2"/><text x="720" y="372" font-family="Arial" font-size="11" font-weight="700" fill="#3C4048">FRET</text><text x="722" y="401" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#17191E">自动按弦架</text><text x="722" y="427" font-family="Microsoft YaHei,Arial" font-size="14" fill="#475467"><tspan x="722" dy="21">可调品位执行器</tspan><tspan x="722" dy="21">硅胶压弦指</tspan><tspan x="722" dy="21">导轨定位</tspan><tspan x="722" dy="21">压力反馈 / 回位</tspan></text></g><g><rect x="700" y="620" width="270" height="175" rx="14" fill="#E8EAED" stroke="#3C4048" stroke-width="2"/><text x="720" y="642" font-family="Arial" font-size="11" font-weight="700" fil