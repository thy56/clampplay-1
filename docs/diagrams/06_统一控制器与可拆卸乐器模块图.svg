<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D9381E"/></marker></defs><rect width="1600" height="1000" fill="#F7F8FA"/><text x="50" y="58" font-family="Microsoft YaHei,Arial" font-size="30" font-weight="700" fill="#17191E">ClampPlay-1 统一控制器与可拆卸乐器模块图</text><text x="50" y="90" font-family="Microsoft YaHei,Arial" font-size="15" fill="#667085">ClampPlay-1 · 通用控制器 + 可拆卸自动执行组件</text><path d="M 290 332 L 375 332" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a)"/><text x="332.5" y="324.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#667085">曲目 / 指令</text><path d="M 685 275 L 800 175" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a)"/><text x="742.5" y="217.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#667085">快拆接口</text><path d="M 685 330 L 800 500" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a)"/><text x="742.5" y="407.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#667085">快拆接口</text><path d="M 685 390 L 800 790" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a)"/><text x="742.5" y="582.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#667085">快拆接口</text><path d="M 1100 175 L 1210 390" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a)"/><text x="1155.0" y="274.5" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#667085">自动按键</text><path d="M 1100 500 L 1210 450" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a)"/><text x="1155.0" y="467.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#667085">自动按弦 + 拨弦</text><path d="M 1100 790 L 1210 520" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a)"/><text x="1155.0" y="647.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#667085">自动敲击</text><path d="M 1350 580 L 1350 710" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#a)"/><text x="1350.0" y="637.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#667085">状态回读</text><path d="M 1210 792 L 685 430" fill="none" stroke="#D9381E" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#r)"/><text x="947.5" y="603.0" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="13" fill="#D9381E">急停</text><g><rect x="60" y="250" width="230" height="165" rx="14" fill="#FCE4D6" stroke="#E8732A" stroke-width="2"/><text x="80" y="272" font-family="Arial" font-size="11" font-weight="700" fill="#E8732A">SOFTWARE</text><text x="82" y="301" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#17191E">移动端 App</text><text x="82" y="327" font-family="Microsoft YaHei,Arial" font-size="14" fill="#475467"><tspan x="82" dy="21">选择乐器 / 曲目</tspan><tspan x="82" dy="21">生成音符或节拍指令</tspan><tspan x="82" dy="21">配置力度、速度、时序</tspan><tspan x="82" dy="21">监看状态与急停</tspan></text></g><g><rect x="375" y="175" width="310" height="310" rx="14" fill="#DDEBFA" stroke="#4B93E6" stroke-width="2"/><text x="395" y="197" font-family="Arial" font-size="11" font-weight="700" fill="#4B93E6">CORE</text><text x="397" y="226" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#17191E">通用控制器主机</text><text x="397" y="252" font-family="Microsoft YaHei,Arial" font-size="14" fill="#475467"><tspan x="397" dy="21">主控 MCU / 协议解析</tspan><tspan x="397" dy="21">可扩展驱动通道</tspan><tspan x="397" dy="21">供电、限流、急停</tspan><tspan x="397" dy="21">传感器采集与状态回读</tspan><tspan x="397" dy="21">模块身份识别 / 快拆接口</tspan></text></g><g><rect x="800" y="75" width="300" height="195" rx="14" fill="#F0E7FA" stroke="#7856B6" stroke-width="2"/><text x="820" y="97" font-family="Arial" font-size="11" font-weight="700" fill="#7856B6">PIANO MODULE</text><text x="822" y="126" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#17191E">钢琴自动按键组件</text><text x="822" y="152" font-family="Microsoft YaHei,Arial" font-size="14" fill="#475467"><tspan x="822" dy="21">夹持于键盘上方</tspan><tspan x="822" dy="21">键位执行器阵列</tspan><tspan x="822" dy="21">每个音符 → 对应键位按压</tspan><tspan x="822" dy="21">毛毡/硅胶接触 + 回位</tspan></text></g><g><rect x="800" y="390" width="300" height="220" rx="14" fill="#F0E7FA" stroke="#7856B6" stroke-width="2"/><text x="820" y="412" font-family="Arial" font-size="11" font-weight="700" fill="#7856B6">GUITAR MODULE</text><text x="822" y="441" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#17191E">吉他自动演奏组件</text><text x="822" y="467" font-family="Microsoft YaHei,Arial" font-size="14" fill="#475467"><tspan x="822" dy="21">按弦架：品位定位 / 下压</tspan><tspan x="822" dy="21">拨弦架：拨片或拨杆</tspan><tspan x="822" dy="21">先按弦 → 再拨弦</tspan><tspan x="822" dy="21">释放 → 切换下一和弦</tspan></text></g><g><rect x="800" y="705" width="300" height="170" rx="14" fill="#F0E7FA" stroke="#7856B6" stroke-width="2"/><text x="820" y="727" font-family="Arial" font-size="11" font-weight="700" fill="#7856B6">DRUM MODULE</text><text x="822" y="756" font-family="Microsoft YaHei,Arial" font-size="20" font-weight="700" fill="#17191E">架子鼓自动敲击组件</text><text x="822" y="782" font-family="Microsoft YaHei,Arial" font-size="14" fill="#475467"><tspan x="822" dy="21">夹具固定鼓圈 / 支架</tspan><tspan x="822" dy="21">电磁铁或推杆鼓槌</tspan><tspan x="822" dy="21">节拍指令 → 对应鼓面敲击</tspan><tspan x="822" dy="21">行程 / 回位 / 限力</tspan></text></g><g><rect x="1210" y="320" width="280" height="260" rx="14" fill="#E8EAED" stroke="#3C4048" stroke-width="2"/><text x="1230" y="342" font-family="Arial" font-size="11" font-weight="700" fill=